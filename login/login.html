<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Digital Library</title>

    <link rel="stylesheet" href="login.css">
</head>

<body class="login-page">

<main class="container">

    <div class="card">

        <div class="logo">
            <img src="../images/images.png" alt="Digital Library logo">
            <h1>Digital Library</h1>
            <p>Welcome back to your library workspace</p>
        </div>

        <form id="loginForm">

            <h2>Login</h2>

            <input
                type="email"
                id="loginEmail"
                placeholder="Email Address"
                maxlength="50"
                required
            >
            <small class="field-count" id="loginEmailCharacterCount">0/50</small>
            <small class="field-error" id="loginEmailError"></small>

            <div class="password-field">
                <input type="password" id="loginPassword" placeholder="Password" required>
                <button class="password-toggle" type="button" data-password-toggle="loginPassword" aria-label="Show password" aria-pressed="false">
                    <svg class="eye-icon" viewBox="0 0 24 24" aria-hidden="true">
                        <path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7-10-7-10-7Z"></path>
                        <circle cx="12" cy="12" r="3"></circle>
                    </svg>
                    <svg class="eye-off-icon" viewBox="0 0 24 24" aria-hidden="true">
                        <path d="m3 3 18 18"></path>
                        <path d="M10.6 10.6a2 2 0 0 0 2.8 2.8"></path>
                        <path d="M9.9 5.1A11 11 0 0 1 12 4.9c6.4 0 10 7.1 10 7.1a16.6 16.6 0 0 1-3.4 4.5"></path>
                        <path d="M6.6 6.6C3.9 8.3 2 12 2 12s3.6 7.1 10 7.1a10.7 10.7 0 0 0 4.2-.8"></path>
                    </svg>
                </button>
            </div>
            <small class="field-error" id="loginPasswordError"></small>

            <select id="loginRole" required>
                <option value="">Select Role</option>
                <option value="User">User</option>
                <option value="Admin">Admin</option>
            </select>
            <small class="field-error" id="loginRoleError"></small>

            <p class="form-message" id="loginMessage" role="alert" aria-live="polite"></p>

            <button type="submit" class="submitBtn">
                Login
            </button>

            <p class="register-link">
                Don't have an account?
                <a href="../register/register.html">Register Here</a>
            </p>

        </form>


    </div>

</main>
<script src="../student/auth.js"></script>
<script>attachPasswordToggles();</script>
<script src="login.js"></script>

</body>
</html>
