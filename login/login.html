<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Digital Library</title>

    <link rel="stylesheet" href="login.css">
</head>

<body class="login-page">

<main class="container">

    <div class="card">

        <div class="logo">
            <img src="../images/images.png" alt="Digital Library logo">
            <h1>Digital Library</h1>
            <p>Welcome back to your library workspace</p>
        </div>

        <form id="loginForm">

            <h2>Login</h2>

            <input
                type="email"
                id="loginEmail"
                placeholder="Email Address"
                maxlength="50"
                required
            >
            <small class="field-count" id="loginEmailCharacterCount">0/50</small>
            <small class="field-error" id="loginEmailError"></small>

            <input
                type="password"
                id="loginPassword"
                placeholder="Password"
                required
            >
            <small class="field-error" id="loginPasswordError"></small>

            <select id="loginRole" required>
                <option value="">Select Role</option>
                <option value="User">User</option>
                <option value="Admin">Admin</option>
            </select>
            <small class="field-error" id="loginRoleError"></small>

            <p class="form-message" id="loginMessage" role="alert" aria-live="polite"></p>

            <button type="submit" class="submitBtn">
                Login
            </button>

            <p class="register-link">
                Don't have an account?
                <a href="../register/register.html">Register Here</a>
            </p>

        </form>


    </div>

</main>
<script src="../student/auth.js"></script>
<script src="login.js"></script>

</body>
</html>
